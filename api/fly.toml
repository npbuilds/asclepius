# Fly.io configuration for the Asclepius API.
# App name must be globally unique on Fly's namespace.

app = "asclepius-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # v1.5.2 Day 4: lowered from soft=200 / hard=250 (defensible for the
    # pre-ML rule-only API) to soft=8 / hard=16 because the ML PoS Prior
    # path runs a PubMedBERT forward pass per cache-miss request. On
    # shared-cpu-2x with OMP_NUM_THREADS=1, a 512-token forward takes
    # ~3-5 s; queueing more than ~8 concurrent at the proxy lets Fly
    # spin a second machine instead of head-of-line blocking inside one.
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  # v1.5.2 Day 4: upgraded from shared-cpu-1x / 256mb to shared-cpu-2x /
  # 1024mb to accommodate the in-container PubMedBERT-base load (~440 MB)
  # used by the ML PoS Prior module. Cost delta: ~$5/mo extra at typical
  # portfolio traffic.
  size = "shared-cpu-2x"
  memory = "1024mb"

# Persistent volume for the SQLite databases (calibration + feedback). Without
# this they live on the container's ephemeral filesystem and are wiped on every
# redeploy. Mounted at /data; ASCLEPIUS_DB_DIR points the DB paths there (the
# static reference JSON stays baked into the image at api/app/data/, so we mount
# a SEPARATE dir, not over it). Create the volume once with:
#   fly volumes create asclepius_data --region iad --size 1 -a asclepius-api
# Note: a Fly volume binds to one machine, so with one volume the app runs a
# single machine (fine for personal + small-circle traffic). Add volumes if you
# later need concurrent machines.
[mounts]
  source = "asclepius_data"
  destination = "/data"

[env]
  ASCLEPIUS_DB_DIR = "/data"
