# Fly.io configuration for the Asclepius API.
# App name must be globally unique on Fly's namespace.

app = "asclepius-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  # v1.5.2 Day 4: upgraded from shared-cpu-1x / 256mb to shared-cpu-2x /
  # 1024mb to accommodate the in-container PubMedBERT-base load (~440 MB)
  # used by the ML PoS Prior module. Cost delta: ~$5/mo extra at typical
  # portfolio traffic.
  size = "shared-cpu-2x"
  memory = "1024mb"
