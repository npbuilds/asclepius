[project]
name = "asclepius-api"
version = "0.1.0"
description = "Asclepius — biotech venture valuation tool. PoS, rNPV, scorecard, and comparables with a pluggable module registry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "anthropic>=0.40",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    # v1.5.2 Day 4 (runtime ML): these were in [training] until v1.5.1 because
    # the v1.5.1.1 inference path was structured-features-only. v1.5.2's
    # engine runs PubMedBERT in-container for every novel input, so they
    # become base runtime deps. Total install size on the Fly container is
    # ~1.4 GB; the machine size in fly.toml was upgraded to shared-cpu-2x
    # (1 GB RAM) to fit.
    "httpx>=0.27",
    "torch>=2.2",
    "transformers>=4.40",
    "lightgbm>=4.6",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# v1.5.2 training pipeline — pandas + pyarrow are pipeline-only (the
# runtime container reads pre-trained joblib artifacts, not parquet).
# torch + transformers + lightgbm moved to base [dependencies] in
# v1.5.2 Day 4 because the runtime engine needs them for in-container
# PubMedBERT inference.
training = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    # On macOS, LightGBM requires libomp (the LLVM OpenMP runtime). Install
    # with `brew install libomp` before running the training pipeline. The
    # error if missing is a dlopen failure of @rpath/libomp.dylib at first
    # `import lightgbm`. Linux + Windows ship libomp via the wheel.
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app", "data_pipeline"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks legitimately split imports across cells.
"*.ipynb" = ["E402"]
