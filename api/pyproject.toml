[project]
name = "asclepius-api"
version = "0.1.0"
description = "Asclepius — biotech venture valuation tool. PoS, rNPV, scorecard, and comparables with a pluggable module registry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "anthropic>=0.40",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]
# v1.5.2 training pipeline only — not loaded at runtime. Heavy deps live here
# so the production Fly container stays lean (pandas + pyarrow alone are
# >100MB on disk).
training = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "transformers>=4.40",
    "torch>=2.2",
    "huggingface-hub>=0.20",
    "lightgbm>=4.6",
    "rdkit>=2025.3",  # held in case v1.5.3 wants chemistry features (v1.5.2 didn't find them helpful)
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app", "data_pipeline"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks legitimately split imports across cells.
"*.ipynb" = ["E402"]
