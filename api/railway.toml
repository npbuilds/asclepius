# Railway deploy configuration for the Asclepius API.
#
# Nixpacks auto-detects the Python project from pyproject.toml; we override the
# start command because uvicorn isn't a framework Railway auto-recognizes.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
