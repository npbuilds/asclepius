name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-flight runs when a new commit is pushed to the same branch — keeps
# CI minutes spent on the latest state, not stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Test (pytest)
        run: python -m pytest -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Sync-drift check
        # `pnpm typecheck` (and `pnpm build`) auto-run the two sync scripts
        # via the `predev`/`prebuild`/`typecheck` chain. If a commit reached
        # main where the committed methodology-content.ts or
        # predictions-content.ts is stale relative to its source, the sync
        # we just ran will have regenerated different content from what was
        # committed — surfacing as an unstaged diff (or, if the generated
        # file was missing from the commit entirely, as a freshly-created
        # untracked file).
        #
        # We use `git status --porcelain` instead of `git diff --exit-code`
        # because diff doesn't include untracked files. The classic CI miss
        # (per codex review): if a commit accidentally removes the .ts file,
        # `pnpm typecheck` recreates it as untracked, `git diff` reports
        # nothing, the build passes, and Vercel deploys a tree where the
        # file isn't tracked — broken render. Porcelain catches modified +
        # untracked + added + deleted in one check.
        #
        # This step fails fast and points at the local pre-commit hook
        # (scripts/hooks/pre-commit) as the optimistic prevention.
        run: |
          drift="$(git status --porcelain -- lib/methodology-content.ts lib/predictions-content.ts)"
          if [[ -n "$drift" ]]; then
            echo "::error::Sync drift detected. Generated files don't match their sources OR aren't tracked:"
            echo "$drift"
            echo ""
            echo "::error::Fix locally with: cd web && pnpm sync:methodology && pnpm sync:predictions"
            echo "::error::Then: git add web/lib/methodology-content.ts web/lib/predictions-content.ts"
            echo "::error::And amend / re-commit. Install scripts/hooks/install.sh to auto-prevent."
            exit 1
          fi
          echo "Sync-drift check: clean"

      - name: Production build
        # API_BASE is not set in CI — Next.js rewrites still resolve at build
        # time; the build doesn't call the API, so empty is fine.
        run: pnpm build

  methodology-parity:
    name: Methodology ↔ data-layer parity
    runs-on: ubuntu-latest
    # Catches numeric drift between `methodology/*.md` writeups and the
    # reference data they cite (`api/app/data/*.json` + selected engine
    # constants). Stdlib-only — no Python deps needed; the lint reads
    # JSON directly. Gates: any orphan percentage that doesn't match
    # the data layer AND isn't covered by a citation/comparison/allow
    # marker fails the build. See methodology/00-product-thesis.md and
    # scripts/check_methodology_parity.py for the rules.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parity lint
        run: python scripts/check_methodology_parity.py
